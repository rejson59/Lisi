appId: com.lisi.assistant
productName: Lisi
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
  - "!node_modules/**/*"
win:
  target:
    - nsis
    - portable
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lisi
mac:
  target:
    - dmg
  icon: resources/icon.png
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Utility
