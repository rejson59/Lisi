appId: com.lisi.assistant
productName: Lisi
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
publish:
  provider: github
  owner: rejson59
  repo: Lisi
  releaseType: release
win:
  target:
    - nsis
    - portable
  icon: icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lisi
  installerIcon: icon.png
  uninstallerIcon: icon.png
  installerHeaderIcon: icon.png
mac:
  target:
    - dmg
  icon: icon.png
  publish:
    provider: github
linux:
  target:
    - AppImage
    - deb
  icon: icon.png
  category: Utility
  publish:
    provider: github
